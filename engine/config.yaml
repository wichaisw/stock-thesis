# ค่า default ของเกณฑ์ทั้งหมด ค่าที่เป็นสัดส่วนเขียนเป็นทศนิยม (0.10 = 10%) โหลดใหม่ทุกครั้งที่รัน batch
# คำอธิบายของแต่ละค่าอยู่ใน shortlist/config.py และ tooltip บนหน้า settings ค่าที่แก้บนเว็บเก็บใน shortlist.db

liquidity:
  window_days: 20
  min_avg_traded_value: 10_000_000 # บาท/วัน

quality:
  min_quarters: 12
  min_roe: 0.10
  max_de: 1.5
  ocf_window: 4
  ocf_min_positive: 3
  no_loss_window: 4
  max_failed_checks: 2
  # sector ตาม thaifin (หุ้น mai ใช้ industry แทนเพราะ sector เป็น "-")
  financial_sectors:
    - Banking
    - Finance & Securities
    - Insurance
    - Financials

fair_value:
  enabled: [pe_median, pe_minus_1sd, pbv_median, dividend_yield_median, peer_pe, justified_pbv]
  lookback_quarters: 20 # 5 ปี
  min_history_points: 4
  min_peers: 3
  min_dividend_yield: 0.005 # สัดส่วน
  structure_change_threshold: 0.5 # สัดส่วน
  max_pe: 100 # เท่า
  cost_of_equity: 0.10 # สัดส่วน
  terminal_growth: 0.03 # สัดส่วน

cdc:
  # ตรงกับ CDC ActionZone V3 2020 ที่ตั้งไว้บน TradingView (close 12 26 1) ค่าตรงกันทุกหลักทศนิยม
  source: close # close | ohlc4
  ap_length: 1 # smoothing period, 1 = ไม่ smooth
  fast_length: 12
  slow_length: 26
  speed_window: 5
  approaching_eta_days: 20
  just_crossed_days: 5
  min_days: 60

risk_reward:
  swing_low_days: 20
  stop_buffer: 0.03
  min_rrr: 2.0
  max_upside: 1.0

candidates:
  # peer_pe และ justified_pbv เท่านั้นที่ CI ของ backtest 63 วันไม่คร่อม 0 (ดู README) เปลี่ยนต้องมีผล backtest รองรับ
  gate_methods: [peer_pe, justified_pbv]
  min_gate_mos: 0.10
  # backtest 3 ปี ไม่มี look-ahead: bear-approaching cross ใน 20 วัน 62.5% เทียบ bear-far 33.1% (ดู README)
  accepted_states: [bear-approaching, just-crossed]

catalyst:
  horizon_months: 6
  quarter_deadline_days: 45
  annual_deadline_days: 60
  # วันประกาศและวันมีผลของ SET50/100 review (ประมาณ ปรับเมื่อ SET ประกาศจริง)
  index_reviews:
    - { date: 2026-12-15, label: "ประกาศผล SET50/100 review" }
    - { date: 2027-01-04, label: "SET50/100 รอบใหม่มีผล" }
    - { date: 2027-06-15, label: "ประกาศผล SET50/100 review" }
    - { date: 2027-07-01, label: "SET50/100 รอบใหม่มีผล" }
  default_hints:
    - แนวโน้มกำไรไตรมาสถัดไปเทียบ consensus
    - การเปลี่ยนแปลงนโยบายปันผล
    - ข่าวลงทุนหรือ M&A
  hints:
    Tourism & Leisure:
      [
        ยอด booking ล่วงหน้า,
        จำนวนนักท่องเที่ยวต่างชาติ,
        อัตราเข้าพัก (occupancy) และ RevPAR,
      ]
    Construction Services: [backlog, การประมูลงานภาครัฐ, งบลงทุนภาครัฐ]
    Construction Materials: [ราคาเหล็กและปูนซีเมนต์, ยอดก่อสร้างภาครัฐและเอกชน]
    Property Development:
      [ยอด presales, การเปิดโครงการใหม่, อัตรา reject สินเชื่อบ้าน]
    Energy & Utilities:
      [ราคาน้ำมันและก๊าซ, ค่า Ft, ผลประมูลสัมปทานหรือ PPA ใหม่]
    Banking:
      [NIM และทิศทางดอกเบี้ยนโยบาย, NPL และ credit cost, การเติบโตของสินเชื่อ]
    Finance & Securities:
      [มูลค่าซื้อขายในตลาด, NPL ของพอร์ตสินเชื่อ, ทิศทางดอกเบี้ย]
    Insurance: [เบี้ยรับรวม, loss ratio, ผลตอบแทนจากการลงทุน]
    Commerce: [same-store sales growth, การขยายสาขา, กำลังซื้อผู้บริโภค]
    Food & Beverage: [ราคาวัตถุดิบ, ยอดส่งออก, ค่าเงินบาท]
    Agribusiness: [ราคาสินค้าเกษตร, สภาพอากาศและผลผลิต]
    Health Care Services:
      [จำนวนผู้ป่วยต่างชาติ, การเปิดโรงพยาบาลใหม่, ประกันสังคม]
    Information & Communication Technology:
      [ARPU และจำนวนผู้ใช้, การประมูลคลื่นความถี่, งานโครงการภาครัฐ]
    Electronic Components:
      [ยอดสั่งซื้อจากลูกค้าต่างประเทศ, ค่าเงินบาท, วัฏจักร semiconductor]
    Transportation & Logistics:
      [ปริมาณผู้โดยสารหรือสินค้า, ค่าระวางเรือ, ราคาน้ำมัน]
    Petrochemicals & Chemicals: [spread ผลิตภัณฑ์, ราคาน้ำมัน, อุปสงค์จากจีน]
    Automotive: [ยอดผลิตและขายรถยนต์, ยอดส่งออก]
    Media & Publishing: [งบโฆษณา, เรตติ้ง]

batch:
  markets: [SET, mai]
  price_period: 1y
  price_chunk_size: 100
  chunk_delay_seconds: 1.0
  stale_run_minutes: 30
  max_consecutive_network_errors: 5 # หยุด batch เมื่อหุ้น fail ด้วย error ของเครือข่ายติดกันเท่านี้
  max_run_minutes: 20 # หยุด batch เมื่อใช้เวลารวมเกินนี้ (ปกติ 2–3 นาที)
