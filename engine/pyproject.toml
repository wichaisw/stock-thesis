[project]
name = "engine"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "pandas>=3.0.6",
    "playwright>=1.64.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "thaifin>=1.1.0",
    "uvicorn>=0.54.0",
    "yfinance>=1.7.0",
]

[project.scripts]
shortlist-batch = "shortlist.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shortlist"]
